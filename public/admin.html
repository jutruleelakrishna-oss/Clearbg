<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClearBG Admin Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #070b14;
      color: white;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 32px;
      border-radius: 20px;
      background: #101624;
      border: 1px solid #293147;
    }

    h1 {
      margin: 0 0 8px;
    }

    p {
      color: #929bb0;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 20px 0 8px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #30394f;
      background: #080d18;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #727bff;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #eef0ff;
      color: #080b14;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
    }

    #message {
      min-height: 22px;
      margin-top: 14px;
      color: #ff8f8f;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>ClearBG Admin</h1>

    <p>
      Sign in to access ClearBG.
    </p>

    <form id="loginForm">

      <label for="email">Email</label>

      <input
        id="email"
        type="email"
        placeholder="Admin email"
        autocomplete="username"
        required
      >

      <label for="password">Password</label>

      <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
        required
      >

      <button id="loginButton" type="submit">
        Sign In
      </button>

      <div id="message"></div>

    </form>

  </div>


  <script type="module">

    import { createClient }
      from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


    const SUPABASE_URL =
      "https://kqhhjwmifqrkxhygjhap.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_BXXJIGsGG_6uIeyfGXPSkQ_uwjXdRa1";


    const supabase =
      createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const loginForm =
      document.getElementById("loginForm");

    const loginButton =
      document.getElementById("loginButton");

    const message =
      document.getElementById("message");


    loginForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        loginButton.disabled = true;

        loginButton.textContent =
          "Signing in...";

        message.textContent = "";


        const email =
          document.getElementById("email")
            .value
            .trim();

        const password =
          document.getElementById("password")
            .value;


        const {
          data,
          error
        } =
          await supabase.auth
            .signInWithPassword({
              email,
              password
            });


        if (error) {

          message.textContent =
            error.message;

          loginButton.disabled = false;

          loginButton.textContent =
            "Sign In";

          return;
        }


        if (data.session) {

          message.style.color = "#8ff0bf";

          message.textContent =
            "Successfully signed in. Redirecting...";


          setTimeout(() => {

            window.location.href = "/";

          }, 500);

        }

      }
    );

  </script>

</body>
</html>
